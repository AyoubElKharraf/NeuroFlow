# NeuroFlow — full local stack
# Infra: Zookeeper, Kafka, PostgreSQL, ClickHouse, Redis
# Apps:  analytics (FastAPI), backend (Spring Boot), ui (Next.js)
#
# Host ports (defaults / .env):
#   Kafka      → localhost:9092
#   Zookeeper  → localhost:2181
#   PostgreSQL → localhost:5433 (see .env.example)
#   ClickHouse → localhost:8123 (HTTP) / localhost:9000 (native)
#   Redis      → localhost:6379
#   Analytics  → localhost:8001
#   Backend    → localhost:8080
#   UI         → localhost:3000
#
# Quick start:  docker compose up -d --build
# Infra only:   docker compose up -d zookeeper kafka kafka-init postgres clickhouse redis

name: neuroflow

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: neuroflow-zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - neuroflow-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: neuroflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - neuroflow-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: neuroflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Creating NeuroFlow Kafka topics..."
        for topic in telemetry-events ml-predictions alerts; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Topics ready:"
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - neuroflow-net

  postgres:
    image: postgres:16-alpine
    container_name: neuroflow-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-neuroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - neuroflow-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: neuroflow-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-neuroflow_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-neuroflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-neuroflow}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - neuroflow-net

  redis:
    image: redis:7-alpine
    container_name: neuroflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - neuroflow-net

  analytics:
    build:
      context: ./neuroflow-analytics
    image: neuroflow-analytics:local
    container_name: neuroflow-analytics
    ports:
      - "${ANALYTICS_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - neuroflow-net
    restart: unless-stopped

  backend:
    build:
      context: ./neuroflow-backend
    image: neuroflow-backend:local
    container_name: neuroflow-backend
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      BACKEND_PORT: 8080
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-neuroflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-neuroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroflow}
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB:-neuroflow_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-neuroflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-neuroflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANALYTICS_BASE_URL: http://analytics:8000
      ANALYTICS_DRIFT_CHECK_ENABLED: ${ANALYTICS_DRIFT_CHECK_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-NeuroFlowDevSecretKey_ChangeMe_32charsMin!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      NEUROFLOW_ADMIN_USERNAME: ${NEUROFLOW_ADMIN_USERNAME:-admin}
      NEUROFLOW_ADMIN_PASSWORD: ${NEUROFLOW_ADMIN_PASSWORD:-admin123}
      NEUROFLOW_USER_USERNAME: ${NEUROFLOW_USER_USERNAME:-user}
      NEUROFLOW_USER_PASSWORD: ${NEUROFLOW_USER_PASSWORD:-user123}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 75s
    networks:
      - neuroflow-net
    restart: unless-stopped

  ui:
    build:
      context: ./neuroflow-ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: neuroflow-ui:local
    container_name: neuroflow-ui
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - neuroflow-net
    restart: unless-stopped

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  clickhouse_data:
  redis_data:

networks:
  neuroflow-net:
    driver: bridge
